<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="#090d16" stroke="url(#auraGlow)" stroke-width="3" />
  <!-- Calming Aura Core -->
  <circle cx="50" cy="50" r="28" fill="url(#auraGlow)" filter="url(#softGlow)" opacity="0.3" />
  <!-- Sparkle & Heart Silhouette (SDG 3) -->
  <path d="M50 25 C50 25 53 38 65 42 C53 46 50 58 50 58 C50 58 47 46 35 42 C47 38 50 25 50 25 Z" fill="#c084fc" />
  <path d="M50 54 C45 49 38 53 38 60 C38 68 50 75 50 75 C50 75 62 68 62 60 C62 53 55 49 50 54 Z" fill="#34d399" />
</svg>

